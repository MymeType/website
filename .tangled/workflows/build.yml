when:
  - event: ["push", "manual"]
    branch: ["main"]
engine: "nixery"

clone:
  depth: 1

dependencies:
  nixpkgs:
    - nodejs
    - copyparty

steps:
  - name: "Install dependencies"
    command: "npm install"
  - name: "Build and deploy to Nekoweb"
    command: "npm run build"
  - name: "Upload via copyparty"
    command: "u2c -a $COPYPARTY_DEPLOY_KEY --dr https://copyparty-caddy.textht.ml ./dist"
